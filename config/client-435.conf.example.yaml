game:
  roofsEnabled: true
  freeTeleports: false
  debugContextMenu: true
  renderFlames: true
  resizable: false
  shiftClickModifier: true
serverDisplayName: Build 435
gpu:
  # Draw the 3D scene with OpenGL (offscreen, read back into the client's frame). Falls back to software if the
  # platform has no offscreen context; currently only macOS is supported.
  enabled: false
  # Tiles kept visible before fog; the loaded region is 104 tiles across.
  drawDistance: 104
  fog: true
  # Lowest camera pitch (2048 = full circle). The client stops at 128; lower looks further toward the horizon.
  minPitch: 128
  # Tiles of ground (no objects) drawn beyond each edge of the loaded region, from the cache's map files.
  extendedTerrain: 128
